backend:
  name: github
  repo: PeachtownAdmin/website
  branch: main
  # Filled in per request by functions/admin/config.yml.js, so the editor works
  # on peachtown.pages.dev and on the real domain with no rebuild.
  base_url: https://base-url-is-set-per-request.invalid
  auth_endpoint: auth

media_folder: public/images/uploads
public_folder: /images/uploads

publish_mode: simple
site_url: /
display_url: /

collections:
  - name: settings
    label: School information
    description: Details that appear across the whole website.
    editor:
      preview: true
    files:
      - name: site
        label: School details
        file: content/settings/site.json
        fields:
          - { name: schoolName, label: Full school name, widget: string }
          - {
              name: shortName,
              label: Short name,
              widget: string,
              hint: Used in the menu bar and page titles.,
            }
          - {
              name: tagline,
              label: Tagline,
              widget: text,
              required: false,
              hint: One sentence describing the school. Appears on the home page.,
            }
          - name: address
            label: Address
            widget: object
            fields:
              - { name: street, label: Street, widget: string }
              - { name: city, label: Town, widget: string }
              - { name: state, label: State, widget: string }
              - { name: zip, label: ZIP code, widget: string }
          - { name: phone, label: Phone number, widget: string, required: false }
          - { name: email, label: Email address, widget: string, required: false }
          - {
              name: officeHours,
              label: Office hours,
              widget: string,
              required: false,
            }
          - {
              name: facebookUrl,
              label: Facebook page link,
              widget: string,
              required: false,
            }
          - {
              name: googleCalendarId,
              label: Google Calendar ID,
              widget: string,
              required: false,
              hint: Leave this alone unless the school calendar changes.,
            }
          - {
              name: paypalTuitionButtonId,
              label: PayPal tuition button ID,
              widget: string,
              required: false,
              hint: Leave this alone unless PayPal is reconfigured.,
            }
          - {
              name: paypalDonationButtonId,
              label: PayPal donation button ID,
              widget: string,
              required: false,
              hint: Leave this alone unless PayPal is reconfigured.,
            }

      - name: home
        label: Home page
        file: content/settings/home.json
        fields:
          - name: heroSlides
            label: Photos at the top of the home page
            widget: list
            label_singular: photo
            summary: "{{fields.alt}}"
            hint: These fade from one to the next. Two to five works best.
            fields:
              - { name: image, label: Photo, widget: imagefocus, ratio: "5/2" }
              - {
                  name: alt,
                  label: Photo description,
                  widget: string,
                  hint: Describe the photo for visitors who cannot see it.,
                }
          - { name: heroEyebrow, label: Small line above the headline, widget: string, required: false }
          - { name: heroHeading, label: Headline, widget: text }
          - { name: heroLede, label: Sentence under the headline, widget: text, required: false }
          - { name: highlightsEyebrow, label: "Highlights: small heading", widget: string, required: false }
          - { name: highlightsHeading, label: "Highlights: heading", widget: string }
          - { name: highlightsLede, label: "Highlights: intro sentence", widget: text, required: false }
          - name: highlights
            label: "Highlights: the cards"
            widget: list
            label_singular: highlight
            summary: "{{fields.title}}"
            fields:
              - { name: image, label: Photo, widget: imagefocus, ratio: "4/3" }
              - { name: alt, label: Photo description, widget: string }
              - {
                  name: tag,
                  label: Subject,
                  widget: string,
                  hint: "Shown in small capitals above the title, for example Drama.",
                }
              - { name: title, label: Title, widget: string }
              - { name: note, label: One sentence about it, widget: text }
          - { name: heroPrimaryLabel, label: "Hero: main button text", widget: string }
          - { name: heroPrimaryHref, label: "Hero: main button link", widget: string }
          - { name: heroSecondaryLabel, label: "Hero: second button text", widget: string, required: false }
          - { name: heroSecondaryHref, label: "Hero: second button link", widget: string, required: false }
          - name: quickLinks
            label: Quick links bar
            widget: list
            label_singular: link
            summary: "{{fields.label}}"
            hint: The row of shortcuts under the photos, for families who already attend.
            fields:
              - { name: label, label: Label, widget: string }
              - { name: note, label: Small text underneath, widget: string, required: false }
              - { name: href, label: Link, widget: string, hint: "For example /calendar/" }
              - name: icon
                label: Icon
                widget: select
                default: calendar
                options:
                  - { label: Calendar, value: calendar }
                  - { label: Document, value: form }
                  - { label: Megaphone, value: megaphone }
                  - { label: Envelope, value: envelope }
          - name: facts
            label: Three facts
            widget: list
            label_singular: fact
            summary: "{{fields.figure}}"
            fields:
              - { name: figure, label: The big text, widget: string }
              - { name: label, label: The small text under it, widget: string }
          - { name: newsEyebrow, label: "News: small heading", widget: string }
          - { name: missionEyebrow, label: "Mission: small heading", widget: string, required: false }
          - { name: missionQuote, label: "Mission: the quote", widget: text }

  - name: pages
    label: Pages
    editor:
      preview: false
    label_singular: page
    description: The main pages of the website.
    folder: content/pages
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - { name: title, label: Page title, widget: string }
      # linkmode is a custom widget. Ticking it hides the fields a link has no
      # use for, so the form becomes a name and an address. See form-rules.js.
      - {
          name: isLink,
          label: This is a link to another website,
          widget: linkmode,
          default: false,
          hint: Tick this to make the menu entry go straight to another website
            instead of to a page here.,
        }
      - name: linkUrl
        label: Web address to send visitors to
        widget: string
        required: false
        # Catches the commonest mistake, pasting a bare domain, which the
        # browser would read as a page on this site.
        pattern:
          - "^$|^(https?://|mailto:|tel:).+"
          - "Start the address with https://, for example https://www.example.com"
        hint: "Only used when the box above is ticked. Start with https://"
      - {
          name: navLabel,
          label: Menu label,
          widget: string,
          required: false,
          hint: Shorter wording for the menu bar. Leave blank to use the page title.,
        }
      - {
          name: description,
          label: Search engine summary,
          widget: text,
          required: false,
          hint: One or two sentences shown in Google results.,
        }
      # navplace is a custom widget: the same three choices, but it also hides
      # "Sits under" for the top bar, which has no drop-downs. See form-rules.js.
      - name: navGroup
        label: Where this page appears in the menus
        widget: navplace
        default: none
        options:
          - { label: Not in any menu, value: none }
          - { label: Main menu, value: main }
          - { label: Small links bar at the very top, value: utility }
        hint: The small top bar is for things current families need often, like the calendar.
      - name: parent
        label: Sits under
        widget: relation
        required: false
        collection: pages
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        # Only pages on the main menu can be a parent. Menus are one level
        # deep, so offering a page that is itself in a drop-down would build a
        # sub-drop-down that the site does not render.
        filters:
          - { field: navGroup, values: [main] }
        hint: >-
          Puts this page in the drop-down under another page, for example
          Drama under Academics. Leave blank for a page that stands on its own.
          A page that sits under another one appears only in that drop-down,
          not on the bar itself.
      - {
          name: order,
          label: Menu position,
          widget: number,
          default: 0,
          value_type: int,
          hint: Lower numbers appear first.,
        }
      - {
          name: heroImage,
          label: Banner photo,
          widget: image,
          required: false,
          choose_url: false,
        }
      - {
          name: heroImageAlt,
          label: Banner photo description,
          widget: string,
          required: false,
          hint: Describe the photo for visitors who cannot see it.,
        }
      - {
          name: draft,
          label: Hide this page from the website,
          widget: boolean,
          default: false,
        }
      # Not required: a page that is only a link to another website has no
      # body, and the field is hidden in that case, so Decap must not refuse
      # to save it for being empty.
      - { name: body, label: Page content, widget: markdown, required: false }

  - name: news
    label: News and announcements
    editor:
      preview: false
    label_singular: announcement
    folder: content/news
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    # default_sort desc puts the newest announcement at the top of the list.
    sortable_fields:
      - { field: date, label: Date, default_sort: desc }
      - { field: title, label: Headline }
    view_filters:
      - { label: Published, field: draft, pattern: false }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Headline, widget: string }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD" }
      - {
          name: summary,
          label: Short summary,
          widget: text,
          required: false,
          hint: One or two sentences shown in the news list.,
        }
      - {
          name: heroImage,
          label: Main photo,
          widget: image,
          required: false,
          choose_url: false,
        }
      - {
          name: heroImageAlt,
          label: Main photo description,
          widget: string,
          required: false,
        }
      - {
          name: draft,
          label: Save as draft (not visible on the website),
          widget: boolean,
          default: true,
        }
      - { name: body, label: Announcement, widget: markdown }

  - name: staff
    label: Staff
    editor:
      preview: false
    label_singular: staff member
    folder: content/staff
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: name
    sortable_fields:
      - { field: order, label: Position, default_sort: asc }
      - { field: name, label: Name }
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role or job title, widget: string }
      - {
          name: credentials,
          label: Degrees and qualifications,
          widget: string,
          required: false,
          hint: Shown in italics under the name.,
        }
      - { name: email, label: Email address, widget: string, required: false }
      - { name: photo, label: Photo, widget: image, required: false, choose_url: false }
      - {
          name: photoAlt,
          label: Photo description,
          widget: string,
          required: false,
        }
      - {
          name: order,
          label: Position in the list,
          widget: number,
          default: 0,
          value_type: int,
        }
      - {
          name: draft,
          label: Hide this person from the website,
          widget: boolean,
          default: false,
        }
      - { name: body, label: Biography, widget: markdown, required: false }
